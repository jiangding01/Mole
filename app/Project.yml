name: Mole
options:
  bundleIdPrefix: com.mole
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

packages:
  MoleKit:
    path: MoleKit

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    # 开发签名必须用真实证书：ad-hoc 签名的 TCC 授权（完全磁盘访问）绑定
    # 单次编译的 cdhash，每次重建即失效；证书签名绑定 team+bundle id，跨构建保持。
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "7678D75FAE4F9D81C7CBAEA8F991870682302281"
    DEVELOPMENT_TEAM: VAVR439J8G
    DEAD_CODE_STRIPPING: YES

targets:
  MoleApp:
    type: application
    platform: macOS
    sources:
      - path: MoleApp
    dependencies:
      - package: MoleKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mole.mac
        PRODUCT_NAME: Mole
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # 内容延伸到标题栏（设计 §8.1）在代码中以 windowStyle 处理
      configs:
        # Debug 构建改名 MoleDev：开发机上与已安装的正式版 Mole（App 名、
        # 进程名、Dock 标签均为 "Mole"）区分，避免 Cmd-Tab/菜单栏混淆与
        # pgrep 误伤。bundle id 不变（com.mole.mac），FDA/TCC 授权跨构建保持。
        # PRODUCT_MODULE_NAME 钉在 MoleApp：模块名不随产品名漂移，
        # 单测的 @testable import 跨配置稳定。
        Debug:
          PRODUCT_NAME: MoleDev
          PRODUCT_MODULE_NAME: MoleApp
    info:
      path: MoleApp/Info.plist
      properties:
        # 跟随 PRODUCT_NAME：Debug 显示 MoleDev、Release 显示 Mole。
        CFBundleDisplayName: $(PRODUCT_NAME)
        LSMinimumSystemVersion: "14.0"
        # 内嵌字体（Instrument Serif，OFL 许可随包分发）：xcodegen 把资源平铺进
        # Resources 根，"." 让 AppKit 扫描根目录注册全部字体文件。
        ATSApplicationFontsPath: "."
        NSHumanReadableCopyright: ""
        # 开发期核心定位：Finder/open 启动拿不到 scheme 环境变量，经 LSEnvironment
        # 注入源码树路径。构建时 $(SRCROOT) 展开为本机路径；发布/他机上路径不存在时
        # CoreBundleLocator 会校验可执行性并落回内嵌 mole-core，残留无害。
        LSEnvironment:
          MOLE_CORE_PATH: $(SRCROOT)/../mole
        # 非沙盒（设计 ADR-3）：Developer ID 直发 + 公证
    # 内嵌 CLI 核心：fetch_core.sh 产出后取消注释下列资源拷贝
    # postBuildScripts 阶段在 Phase 1 接 CI 时补充（拷贝 mole-core + 校验清单）

  MoleAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MoleAppTests
    dependencies:
      - target: MoleApp
    settings:
      base:
        # 宿主随 PRODUCT_NAME 分配置（Debug=MoleDev / Release=Mole）；
        # xcodegen 默认按目标名推 MoleApp.app，与产品名脱节即找不到宿主。
        BUNDLE_LOADER: $(TEST_HOST)
      configs:
        Debug:
          TEST_HOST: $(BUILT_PRODUCTS_DIR)/MoleDev.app/Contents/MacOS/MoleDev
        Release:
          TEST_HOST: $(BUILT_PRODUCTS_DIR)/Mole.app/Contents/MacOS/Mole

schemes:
  Mole:
    build:
      targets:
        MoleApp: all
    run:
      environmentVariables:
        # 开发模式：直接使用仓库源码树的 CLI 核心（bin/ 下的 Go 二进制）。
        # xcodegen 每次重新生成 scheme，写在这里才不会在换机器时丢失。
        # 发布构建不受影响（届时核心内嵌在 Resources/mole-core，见 fetch_core.sh）。
        MOLE_CORE_PATH: $(SRCROOT)/../mole
    test:
      targets:
        - MoleAppTests
